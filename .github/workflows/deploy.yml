name: Build and Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npm run build

  deploy:
    needs: test
    # Only the maintainer's repo has DEPLOY_SSH_KEY -- without the repository
    # check, every fork's push to main would run this job and fail.
    if: github.repository == 'CodingPA/finance-frontend' && github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Run deploy script on server
        # Pinned to a commit, not a tag: this step is handed the deploy SSH key.
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: fieldwork.cloud
          username: deployer
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: /home/deployer/finance-frontend/deploy.sh

# Reference nginx server block for finance.codingpa.com. Not applied
# automatically -- copy/symlink this into /etc/nginx/sites-available/ on the
# server as part of one-time setup (see README.md's Deployment section).
#
# Serves the Vite build's static output directly (no pm2/Node process for
# the frontend -- there's nothing that needs to stay running just to hand
# back static files) and reverse-proxies /api and /ws to the Django backend,
# which already runs on this same box on port 8001 -- same relative-path
# convention the dev server's Vite proxy uses (vite.config.ts), so the
# production build needs no VITE_API_BASE_URL override.
#
# Run `sudo certbot --nginx -d finance.codingpa.com` after this file is in
# place and nginx has reloaded -- certbot rewrites this file in place to add
# the HTTPS server block and HTTP->HTTPS redirect, so no ssl_certificate
# lines are hand-written here.

server {
    server_name finance.codingpa.com;

    # Deploy user's home directory -- adjust if the deploy user's name or
    # clone location ever changes.
    root /home/deployer/finance-frontend/dist;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Hashed JS/CSS/image filenames from the Vite build are content-addressed
    # -- a new deploy always ships new filenames, so caching them long is safe.
    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    # React Router (client-side routes like /league/competitors/7) needs
    # every unmatched path to fall through to index.html, not 404 -- the app
    # decides what to render once it loads.
    location / {
        try_files $uri /index.html;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/finance.codingpa.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/finance.codingpa.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}


server {
    if ($host = finance.codingpa.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name finance.codingpa.com;
    return 404; # managed by Certbot


}